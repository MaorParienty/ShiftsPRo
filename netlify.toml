[build]
  command = "bun run build"
  publish = "dist"

# No manual redirects needed: Nitro's netlify preset auto-detects the Netlify
# build environment and generates its own server function (in
# .netlify/functions-internal), which Netlify's build system wires up to
# handle SSR pages and /_serverFn/* RPC calls automatically. A blanket
# "/* -> /index.html" redirect would break that by serving the static shell
# for every request instead of routing through the function.
